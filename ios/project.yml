name: CmuxOrbit
options:
  bundleIdPrefix: com.felixisaac
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "RBWTMPP2Q6"
    CODE_SIGN_STYLE: Automatic

targets:
  CmuxOrbit:
    type: application
    platform: iOS
    sources:
      - path: CmuxOrbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.felixisaac.cmuxorbit
        INFOPLIST_FILE: CmuxOrbit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
